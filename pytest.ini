[pytest]
testpaths = tests
addopts = -ra --html=reports/report.html --self-contained-html --screenshot=only-on-failure --tracing=retain-on-failure --output=test-results
markers =
    smoke: fast checks of the most important flows
    regression: full functional coverage
    negative: invalid input and error handling
    known_issue: documents intentional/known SauceDemo defects (expected to fail)
